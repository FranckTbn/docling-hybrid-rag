name: Tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest discover -s tests -v
        env:
          HF_HUB_OFFLINE: '1'
          TOKENIZERS_PARALLELISM: 'false'
